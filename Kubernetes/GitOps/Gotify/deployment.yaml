apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify
  namespace: gotify
  labels:
    app: gotify
    app.kubernetes.io/instance: gotify
    app.kubernetes.io/name: gotify
spec:
  selector:
    matchLabels:
      app: gotify
  replicas: 1
  template:
    metadata:
      labels:
        app: gotify
        app.kubernetes.io/instance: gotify
        app.kubernetes.io/name: gotify
    spec:
      nodeSelector:
        worker: "true"
      containers:
      - name: gotify
        # Pin to the major tag so a pod restart can't silently pull a new major.
        image: gotify/server:2
        env:
        - name: GOTIFY_DB_SQLITE
          value: /app/data/gotify.db
        - name: GOTIFY_PORT
          value: "80"
        ports:
        - containerPort: 80
        # Limits so a leak or spike can't starve the node.
        resources:
          requests:
            memory: "16Mi"
            cpu: "25m"
            ephemeral-storage: "64Mi"
          limits:
            memory: "128Mi"
            cpu: "200m"
            ephemeral-storage: "256Mi"
        # Probes: liveness is a cheap TCP check; readiness hits /version,
        # which Gotify serves unauthenticated, so traffic waits until it's up.
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /version
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
        # Defense-in-depth. Gotify binds :80, so ALL caps are dropped and only
        # NET_BIND_SERVICE is added back — nothing else is needed.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: gotify
          mountPath: /app/data
      volumes:
      - name: gotify
        persistentVolumeClaim:
          claimName: gotify
---
apiVersion: v1
kind: Service
metadata:
  name: gotify
  namespace: gotify
  labels:
    app: gotify
    app.kubernetes.io/instance: gotify
    app.kubernetes.io/name: gotify
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: gotify
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gotify
  namespace: gotify
  labels:
    app: gotify
    app.kubernetes.io/instance: gotify
    app.kubernetes.io/name: gotify
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
